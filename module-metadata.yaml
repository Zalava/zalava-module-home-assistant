schemaVersion: 1
modules:
  - moduleId: zalava-module-home-assistant
    version: 0.1.0-alpha.1
    displayName: Home Assistant
    description: Bounded read-only Home Assistant status and entity discovery plus the module-declared, release-pinned managed-service declaration for a SEA-managed Home Assistant Container.
    supportUrl: https://github.com/Zalava/zalava-module-home-assistant
    artifact:
      groupId: org.zalava.modules
      artifactId: zalava-module-home-assistant
      version: 0.1.0-alpha.1
    source:
      repository: https://github.com/Zalava/zalava-module-home-assistant.git
      license: Apache-2.0
    build:
      command: ["./gradlew", "build"]
      verificationCommand: ["./gradlew", "test"]
    compatibility:
      seaRuntime: ">=1.0.0 <2.0.0"
    configurationSchema:
      type: object
      additionalProperties: false
      properties:
        home-assistant:
          type: object
          additionalProperties: false
          required: ["baseUrl", "tokenRef"]
          properties:
            baseUrl:
              type: string
              title: Loopback base URL
              description: "Loopback base URL of the SEA-managed Home Assistant instance, e.g. http://127.0.0.1:8123"
            tokenRef:
              type: string
              title: Token reference
              description: Secret reference for the scoped Home Assistant long-lived access token
            requestTimeoutSeconds:
              type: integer
              minimum: 1
              title: Request timeout (seconds)
            maxResponseBytes:
              type: integer
              minimum: 1
              title: Maximum response bytes
    factories:
      - factoryId: home-assistant
        providerType: home-automation
    services:
      provided: []
      required: []
    operations: []
    security:
      permissions: []
